# XcodeGen spec for the iPad shell. Generate the project with:
#   brew install xcodegen && cd shell-ipad && xcodegen generate && open Cruth.xcodeproj
# The C++ core is compiled straight into the app target from ../core, so there
# is no separate library build step.
name: Cruth
options:
  bundleIdPrefix: org.cruth
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    CLANG_CXX_LIBRARY: libc++
    GCC_C_LANGUAGE_STANDARD: c11
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Cruth:
    type: application
    platform: iOS
    sources:
      - path: Cruth
      - path: ../core/src
        group: Core
      - path: ../core/include
        group: Core
        buildPhase: none
      # QuadriFlow builds as C++17, as in third_party/CMakeLists.txt (it also
      # compiles as C++20 with libc++; see quadriflow/CRUTH_PATCHES.md).
      # Per-file flags come after the target's -std=c++20, so this -std wins.
      - path: ../third_party/quadriflow/src
        group: ThirdParty/QuadriFlow
        compilerFlags: ["-w", "-std=c++17"]
    # Signing for device builds: Signing.xcconfig optionally includes the
    # git-ignored Signing.local.xcconfig with your DEVELOPMENT_TEAM and
    # CRUTH_BUNDLE_ID (docs/SETUP.md). Simulator builds need neither.
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_NAME: Cruth
        PRODUCT_BUNDLE_IDENTIFIER: $(CRUTH_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "2"
        INFOPLIST_FILE: Cruth/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Cruth/Cruth-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/../core/include
          - $(SRCROOT)/../third_party/quadriflow/src
          - $(SRCROOT)/../third_party/quadriflow/3rd
          - $(SRCROOT)/../third_party/eigen
          - $(SRCROOT)/../third_party/lemon
        GCC_PREPROCESSOR_DEFINITIONS:
          - $(inherited)
          - EIGEN_MPL2_ONLY
          - QUADRIFLOW_NO_EXTERNAL_SAT
        # Resolve includes through HEADER_SEARCH_PATHS only: core and QuadriFlow
        # both have a subdivide.hpp, which a header map would make ambiguous.
        USE_HEADERMAP: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    # `xcodebuild test -scheme Cruth` (./scripts/ipad.sh test) runs the UI smoke tests.
    scheme:
      testTargets:
        - CruthUITests
  # XCUITest smoke tests that drive the app in the simulator with synthesised touches.
  CruthUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CruthUITests
    dependencies:
      - target: Cruth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.cruth.app.uitests
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
