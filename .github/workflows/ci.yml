name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      acceptance_scale:
        description: "Acceptance chain scale (smoke or full)"
        default: full
        type: choice
        options: [smoke, full]

permissions:
  contents: read

jobs:
  core:
    name: Core (${{ matrix.os }}, ${{ matrix.config }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            config: Release
            flags: ""
            ctest: ""
          - os: ubuntu-latest
            config: Debug
            flags: -DCRUTH_SANITIZE=ON
            ctest: -LE acceptance  # the acceptance job covers it; too slow unoptimised
          - os: macos-latest
            config: Release
            flags: ""
            ctest: ""
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DCRUTH_WARNINGS_AS_ERRORS=ON ${{ matrix.flags }}
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure ${{ matrix.ctest }}

  acceptance:
    # PRD phase-0 exit gate: sculpt -> guided quad remesh -> retopo -> seams +
    # UDIM unwrap -> bake normal/displacement -> verify, timed per stage.
    name: Acceptance chain (${{ inputs.acceptance_scale || 'smoke' }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCRUTH_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build --parallel --target cruth-acceptance
      - name: Run
        run: build/tools/cruth-acceptance/cruth-acceptance --scale ${{ inputs.acceptance_scale || 'smoke' }} --out acceptance
      - name: Decode outputs independently
        # The pure-Python decoder is too slow for the full scale's 4K maps.
        if: ${{ (inputs.acceptance_scale || 'smoke') == 'smoke' }}
        run: python3 tests/tools/check_images.py acceptance/*.exr acceptance/*.png
      - name: Upload report and assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-${{ inputs.acceptance_scale || 'smoke' }}
          path: acceptance/

  ipad-shell:
    name: iPad shell (simulator build)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: shell-ipad
        run: xcodegen generate
      - name: Build
        working-directory: shell-ipad
        run: |
          xcodebuild build \
            -project Cruth.xcodeproj \
            -scheme Cruth \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  licences:
    name: Licence guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject GPL-family code in the tree
        run: |
          # PRD: no GPL dependency anywhere. Fails if a vendored file declares one.
          if grep -rIlE "SPDX-License-Identifier: *(A?GPL|LGPL)" --exclude-dir=.git --exclude-dir=docs --exclude-dir=.github .; then
            echo "GPL-family licence found"; exit 1
          fi
